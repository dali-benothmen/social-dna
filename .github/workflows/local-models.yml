name: optional-local-models
on: workflow_dispatch
jobs:
  speech-ocr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv sync --locked --extra speech --extra ocr
      - name: Explicitly prepare pinned model weights
        run: |
          uv run socialdna models prepare asr-tiny --allow-download --data-dir "$RUNNER_TEMP/socialdna-models"
          uv run socialdna models prepare ocr-en --allow-download --data-dir "$RUNNER_TEMP/socialdna-models"
      - name: Real offline ASR/OCR and report restart
        env:
          SOCIALDNA_TEST_MODEL_LIBRARY: ${{ runner.temp }}/socialdna-models
        run: uv run pytest tests/integration/test_real_local_models.py::test_real_cpu_asr_ocr_and_restart -q
