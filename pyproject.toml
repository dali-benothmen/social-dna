[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "socialdna"
version = "0.0.1"
description = "Local-first, evidence-grounded social media research engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "typer>=0.27.2,<0.28",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "platformdirs>=4.3,<5",
  "SQLAlchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "qdrant-client>=1.12,<2",
  "networkx>=3.4,<4",
  "portalocker>=3,<4",
]

[project.scripts]
socialdna = "socialdna.cli.app:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "hypothesis>=6.120,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/socialdna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/socialdna"]
ignore_missing_imports = true
