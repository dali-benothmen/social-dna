[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "socialdna"
version = "0.0.6"
description = "Local-first, evidence-grounded social media research engine"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "typer>=0.27.2,<0.28",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "platformdirs>=4.3,<5",
  "SQLAlchemy>=2.0.36,<3",
  "alembic>=1.14,<2",
  "qdrant-client>=1.12,<2",
  "networkx>=3.4,<4",
  "portalocker>=3,<4",
  "numpy>=2,<3",
  "opencv-python-headless>=4.10,<5",
  "scenedetect-headless>=0.7,<0.8",
  "Pillow>=11,<13",
  "scipy>=1.14,<2",
  "librosa>=0.11,<0.12",
  "soundfile>=0.13,<1",
  "pysubs2>=1.8,<2",
  "httpx>=0.28,<1",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "statsmodels>=0.14.4,<0.15",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.2.1,<1.3"]
ocr = ["rapidocr==3.10.0", "onnxruntime>=1.20,<2"]
alignment = ["whisperx==3.8.6; python_version < '3.14'"]
landmarks = ["mediapipe>=0.10.32,<2"]
audio-classifier = ["mediapipe>=0.10.32,<2"]

[project.scripts]
socialdna = "socialdna.cli.app:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "hypothesis>=6.120,<7",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/socialdna"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["local_models: opt-in tests with prepared real local model weights"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/socialdna"]
ignore_missing_imports = true
